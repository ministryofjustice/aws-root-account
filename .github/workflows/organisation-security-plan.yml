name: terraform plan (organisation-security)

on:
  pull_request:
    paths:
      - "organisation-security/terraform/**"
      - "modules/**"
      - ".github/workflows/organisation-security-plan.yml"
      - ".github/workflows/organisation-security-apply.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./organisation-security/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{secrets.AWS_SECURITY_ACCOUNT_ID}}:role/github-actions-plan
          role-session-name: GitHubActionsPlan
          aws-region: eu-west-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
      - run: terraform init
      - run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -detailed-exitcode | ../../scripts/redaction.sh | tee plan-output.txt

      # The wiz_template_current check only warns, so it does not change the plan exit code.
      - name: Check Wiz member template version
        id: wiz_template
        if: ${{ !cancelled() }}
        run: |
          if [ -f plan-output.txt ] && grep -q 'check "wiz_template_current"' plan-output.txt; then
            upstream=$(grep -o 'published member template [^;]*' plan-output.txt | head -1 | sed 's/.* //' | tr -cd '[:alnum:]-')
            upstream=${upstream:-unknown}
            echo "::warning title=Wiz template update::Wiz member template ${upstream} differs from the version pinned in modules/wiz-stackset."
            echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Slack if drift detected on scheduled run
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.plan.outputs.exitcode == '2' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          retries: "0"
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":old-man-yells-at-terraform: *Terraform Drift Detected!* \n\nDrift has been detected in the repository *<https://github.com/${{ github.repository }}|${{ github.repository }}>*. To correct the drift, re-apply the latest terraform code or update the code.\n\n*Workflow:* `${{ github.workflow }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Apply organisation-security"
                      },
                      "url": "https://github.com/ministryofjustice/aws-root-account/actions/workflows/organisation-security-apply.yml"
                    }
                  ]
                }
              ]
            }

      - name: Alert Slack if Wiz has published a newer member template
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.wiz_template.outputs.upstream != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          retries: "0"
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Wiz member template update available* \n\nWiz has published member template `${{ steps.wiz_template.outputs.upstream }}`, which differs from the version pinned in `modules/wiz-stackset/wiz-aws-standard.json`. Review the upstream changes before updating the committed file and its checksum.\n\n*Workflow:* `${{ github.workflow }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }
